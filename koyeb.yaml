# Koyeb deployment config
# Deploy via: koyeb app init threads-bot --git github.com/dousheng34/Threads-Bot-Factory --git-branch main
# Or import this file in the Koyeb dashboard.

name: threads-bot-factory
services:
  - name: bot
    type: web
    git:
      repository: github.com/dousheng34/Threads-Bot-Factory
      branch: main
      buildpack: dockerfile
    instance_type: nano        # 0.1 vCPU / 512MB — enough for the bot
    regions:
      - fra                    # Frankfurt; pick whatever's closest
    scaling:
      min: 1
      max: 1                   # MUST be 1 — SQLite + scheduler are not multi-instance safe
    ports:
      - port: 8080
        protocol: http
    routes:
      - path: /
        port: 8080
    health_checks:
      - http:
          path: /health
          port: 8080
        grace_period: 30s
        interval: 30s
        timeout: 5s
    # Mount a persistent volume so SQLite survives redeploys.
    # Create volume in Koyeb dashboard first: name=botdata, size=1GB
    volumes:
      - name: botdata
        path: /app/data
    env:
      # ===== Required =====
      - name: BOT_TOKEN
        secret: bot_token
      - name: THREADS_APP_ID
        secret: threads_app_id
      - name: THREADS_APP_SECRET
        secret: threads_app_secret
      - name: ADMIN_IDS
        secret: admin_ids
      # IMPORTANT: must match the Koyeb public URL of THIS service + /callback
      # e.g. https://threads-bot-factory-<your-org>.koyeb.app/callback
      - name: REDIRECT_URI
        secret: redirect_uri

      # ===== AI =====
      - name: AI_PROVIDER
        value: gemini
      - name: GEMINI_API_KEY
        secret: gemini_api_key
      - name: GEMINI_MODEL
        value: gemini-2.0-flash
      - name: GROQ_API_KEY
        secret: groq_api_key       # optional fallback
      - name: OPENROUTER_API_KEY
        secret: openrouter_api_key  # optional fallback

      # ===== Auto-reply behavior =====
      - name: AI_REPLY_ENABLED
        value: "false"             # turn on with /ai_reply_on after first deploy
      - name: AI_REPLY_STYLE
        value: friendly
      - name: AI_REPLY_DELAY_MIN
        value: "60"
      - name: AI_REPLY_DELAY_MAX
        value: "300"
      - name: AI_REPLY_DAILY_LIMIT
        value: "40"
      - name: AI_SKIP_TOXIC
        value: "true"

      # ===== Storage =====
      - name: DB_PATH
        value: /app/data/bot_factory.db
