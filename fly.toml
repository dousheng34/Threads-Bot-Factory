app = "threads-bot-factory"
primary_region = "fra"

[build]

[env]
  PORT = "8080"

  [[services]]
    protocol = "tcp"
      internal_port = 8080
        auto_stop_machines = false
          auto_start_machines = true
            min_machines_running = 1

              [[services.ports]]
                  handlers = ["http"]
                      port = 80
                          force_https = true

                            [[services.ports]]
                                handlers = ["tls", "http"]
                                    port = 443

                                      [services.concurrency]
                                          type = "connections"
                                              hard_limit = 25
                                                  soft_limit = 20

                                                    [[services.http_checks]]
                                                        interval = 30000
                                                            timeout = 5000
                                                                grace_period = "30s"
                                                                    method = "get"
                                                                        path = "/health"

                                                                        [[vm]]
                                                                          size = "shared-cpu-1x"
                                                                            memory = "256mb"
                                                                            
